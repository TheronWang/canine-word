# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 100
  seed: 1337
  tensorboard_logdir: tblog

checkpoint:
  save_interval_updates: 1000
  save_interval: 1
  keep_interval_updates: 200
  no_epoch_checkpoints: true
  restore_file: /home/xingyuan/animal_language2/code/audio_representation/fairseq/examples/hubert/pretrain_models/hubert_base_ls960.pt
  reset_dataloader: true
  reset_lr_scheduler: true
  reset_meters: true
  reset_optimizer: true

distributed_training:
  ddp_backend: no_c10d
  distributed_backend: 'nccl'
  distributed_world_size: 2 # 32, 2
#  distributed_port: 29671
  nprocs_per_node: 2 # 8, 2
  find_unused_parameters: true

task:
  _name: hubert_pretraining
  data: /data/xingyuan/animal_language/v2/out/fairseq/six_balance/tsv
  label_dir: /data/xingyuan/animal_language/v2/out/fairseq/six_balance/iter1/km100
  labels: ["km"]
  label_rate: ${model.label_rate}
  sample_rate: 16000
  max_sample_size: 80000 # 250000
  min_sample_size: 5600
  pad_audio: false
  random_crop: true
  normalize: false # must be consistent with extractor

dataset:
  num_workers: 16
  max_tokens: 1400000 # 1400000
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 20
  validate_interval_updates: 1000
  batch_size: 2048


criterion:
  _name: hubert
  pred_masked_weight: 1.0
  pred_nomask_weight: 0.0
  loss_weights: [10,]

optimization:
  max_epoch: 500000 # 500000
  max_update: 500000000
  lr: [0.0001]
  clip_norm: 10.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: polynomial_decay
  warmup_updates: 3200

model:
  _name: hubert
  label_rate: ???
  skip_masked: false
  skip_nomask: false
  mask_prob: 0.8
  mask_length: 6
  extractor_mode: default
  conv_feature_layers: '[(512,10,5)] + [(512,3,2)] * 4 + [(512,2,2)] * 2'
  final_dim: 256
  encoder_layerdrop: 0.05
  dropout_input: 0.1
  dropout_features: 0.1
  dropout: 0.1
  attention_dropout: 0.1
  feature_grad_mult: 0.1
  untie_final_proj: true
  activation_dropout: 0.0

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
  run:
    dir: /data/xingyuan/animal_language/v2/out/fairseq/six_balance/iter1/res1
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
