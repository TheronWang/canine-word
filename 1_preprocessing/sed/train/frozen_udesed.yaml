  audio_max_len: 10
  fs: 16000
  net_subsample: 4
opt:
  mode: adam # adam or sgd or both
  cnn_lr: 0.001
  rnn_lr: 0.001
  tfm_lr: 0.0001
  tfm_lr_scale: 0.5
  tfm_trainable_layers: 0 # max: 14; min: 0 for freezing
feats:
  n_mels: 128
  n_filters: 2048
  hop_length: 256
  n_window: 2048
  sample_rate: 16000
  f_min: 0
  f_max: 8000
net:
  dropout: 0.5
  rnn_layers: 4
  n_in_channel: 1
  nclass: 1
  attention: True
  n_RNN_cell: 256
  activation: cg
  rnn_type: BGRU
  kernel_size: [3, 3, 3, 3, 3, 3, 3]
  padding: [1, 1, 1, 1, 1, 1, 1]
  stride: [1, 1, 1, 1, 1, 1, 1]
  nb_filters: [ 16, 32, 64, 128, 256, 256, 256 ]
  pooling: [ [ 2, 2 ], [ 2, 2 ], [ 1, 2 ], [ 1, 2 ], [ 1, 2 ], [ 1, 2 ], [ 1, 2 ] ]
  dropout_recurrent: 0
  use_embeddings: True
  embedding_size: 768
  embedding_type: frame
  aggregation_type: pool1d # nni/pool1d/mha
ultra:
